plugins {
	id 'com.unascribed.nilgradle' version '1.5.1'
}

java {
	// You can change this to be higher if you like. NilLoader itself is compiled
	// for Java 8 for compatibility with older versions.
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

group = 'de.femtopedia'
version = project.findProperty('version')
version = version == null || version == 'unspecified' ? '1.0' : version

base {
	archivesName = 'Nil123Fix'
}

repositories {
	mavenCentral()
	maven {
		url = 'https://repo.sleeping.town'
		content {
			includeGroup 'com.unascribed'
		}
	}
	maven {
		url = 'https://maven.minecraftforge.net'
		metadataSources {
			artifact()
		}
		content {
			includeGroup 'net.minecraftforge'
		}
	}
	maven {
		url = 'https://maven.wagyourtail.xyz/releases'
	}
	flatDir {
		dirs 'libs'
		content {
			includeGroup 'libs'
		}
	}
}

nil {
	id "nil123fix"
	// Set this to false for a smaller JAR that can't be run as a standalone Java agent
	standalone false
}

dependencies {
	loader 'com.unascribed:nilloader:1.4.1'

	compileOnly('org.lwjgl.lwjgl:lwjgl:2.9.3') {
		transitive = false
	}

	game nil.minecraft('1.2.3', 'client')

	jarmod 'risugami:modloader:1.2.3'
	jarmod 'modloadermp:modloadermp:1.2.3:client'
	jarmod 'net.minecraftforge:forge:1.2.3-1.4.1.64:client@zip'
}

mappings {
	side 'client'
	work nil.mcpArchive('1.2.3', '60')
	mapClass('ModLoader', 'net/minecraft/src/ModLoader')
}
